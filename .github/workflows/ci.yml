name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the point of the Python port — the shell version
        # could not run there at all. pty-dependent tests self-skip.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test.py

  # Proves the published package actually runs after `npm i -g` — in
  # particular that npm's Windows shim resolves the `python3` shebang, which
  # is not guaranteed since python.org installers ship python.exe, not python3.
  npm-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm i -g .
      - name: jackal runs through the npm shim
        shell: pwsh
        run: |
          $out = (jackal 2>&1 | Out-String)
          Write-Host "output: $out"
          if ($out -notmatch 'need a terminal') {
            Write-Error "shim did not reach jackal"
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned ruff turns every new lint rule into a red build on
      # a commit that changed nothing.
      - run: pipx run ruff==0.16.0 check jackal test.py
      - run: pipx run ruff==0.16.0 format --check jackal test.py
