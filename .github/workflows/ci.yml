name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -s sh forces POSIX mode, so bash/zsh-only constructs fail here rather
      # than on a user's Debian box where /bin/sh is dash.
      - run: shellcheck -s sh jackal test.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./test.sh

  test-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y dash
      - run: TEST_SH=/bin/dash ./test.sh
